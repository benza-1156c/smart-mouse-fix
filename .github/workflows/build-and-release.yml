name: 'Build & Release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Application & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SmartMouseFix v__VERSION__'
          releaseBody: 'Download the installer assets below to install SmartMouseFix on Windows.'
          releaseDraft: false
          prerelease: false

      - name: Copy installer to dist-installer folder
        run: node scripts/copy-installer.js

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartMouseFix-Windows-Installer
          path: dist-installer/*
          if-no-files-found: warn

